name: Sync package-lock.json

# Manually triggered workflow to regenerate package-lock.json so it matches
# package.json. Run this after any package.json version bump where the lock
# file could not be committed directly (e.g. large file size constraints).
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate lock file
        run: npm install --package-lock-only

      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "Lock file already in sync, nothing to commit." || (
            git commit -m "chore: sync package-lock.json with package.json [skip ci]"
            git push
          )
