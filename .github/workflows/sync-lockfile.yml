name: Sync package-lock.json

# Regenerates package-lock.json to match package.json and commits the result.
# Triggers:
#   - workflow_dispatch: manual trigger from GitHub UI
#   - push to main: auto-fixes any lockfile drift on every commit
# The workflow commit uses [skip ci] to prevent re-triggering.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate lock file
        run: npm install --package-lock-only

      - name: Commit updated lock file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && echo "Lock file already in sync, nothing to commit." || (
            git commit -m "chore: sync package-lock.json with package.json [skip ci]"
            git push
          )
