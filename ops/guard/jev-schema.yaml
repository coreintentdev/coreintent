$schema: "http://json-schema.org/draft-07/schema#"
title: JEV — Judgment · Evidence · Verdict
description: Typed output format for the CoreIntent guard layer.

type: object
required:
  - judgment
  - evidence
  - verdict

properties:
  task:
    type: string
    description: The original task or question.

  timestamp:
    type: string
    format: date-time
    description: UTC ISO-8601 timestamp.

  judgment:
    type: string
    enum:
      - proceed
      - blocked
      - needs-evidence
      - deferred
    description: Final gate judgment from Layer 2 and above.

  evidence:
    type: object
    required:
      - proofs
      - gaps
      - blind_spots
    properties:
      proofs:
        type: array
        items:
          type: object
          required:
            - kind
            - value
          properties:
            kind:
              type: string
              enum: [command, log, checksum, url, file, human]
            value:
              type: string
            verified:
              type: boolean
              default: false
      gaps:
        type: array
        items:
          type: string
      blind_spots:
        type: array
        items:
          type: string

  verdict:
    type: object
    required:
      - consensus
      - confidence
    properties:
      consensus:
        type: string
        description: Human-readable summary of the collective view.
      dissent:
        type: array
        items:
          type: object
          properties:
            role:
              type: string
            reason:
              type: string
      confidence:
        type: number
        minimum: 0
        maximum: 1
        description: Mesh confidence, 0.0 to 1.0.

  layers:
    type: array
    items:
      type: object
      required:
        - layer
        - role
      properties:
        layer:
          type: integer
          minimum: 1
          maximum: 7
        role:
          type: string
        output:
          type: string
        gate:
          type: boolean

  actions:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        approved:
          type: boolean
        requires_human:
          type: boolean

  metadata:
    type: object
    properties:
      source:
        type: string
      policy_version:
        type: string
      roles_version:
        type: string
